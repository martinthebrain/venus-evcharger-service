[package]
name = "venus-evcharger-dbus-adapter"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
fs2 = "=0.4.3"
quick-xml = "=0.38.4"
rustix = { version = "=1.1.4", features = ["time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
zbus = "=5.19.0"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
