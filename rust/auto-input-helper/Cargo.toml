[package]
name = "venus-evcharger-auto-input-helper"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
md5 = "=0.7.0"
rustix = { version = "=1.1.4", features = ["time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serialport = { version = "=4.7.3", default-features = false }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
