[package]
name = "venus-evcharger-forensic-observer"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
fs2 = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
proptest = "=1.8.0"
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
