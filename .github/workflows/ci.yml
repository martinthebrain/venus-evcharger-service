name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            python3-requests \
            python3-dbus \
            python3-gi \
            shellcheck

      - name: Install pinned Python dev tools
        run: bash ./scripts/dev/install_dev_tools.sh

      - name: Run syntax, tests, and typecheck
        run: bash ./scripts/dev/check_all.sh

      - name: Run optional audits
        run: make audit

      - name: Run unit and platform coverage gates
        run: bash ./scripts/dev/run_coverage.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
