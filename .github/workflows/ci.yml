name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            python3-requests \
            python3-dbus \
            python3-gi \
            doxygen \
            gcc-arm-linux-gnueabihf \
            shellcheck

      - name: Install pinned Python dev tools
        run: bash ./scripts/dev/install_dev_tools.sh

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Run syntax, Rust tests, lint, and typecheck
        run: bash ./scripts/dev/check_all.sh --skip-python-tests

      - name: Run Python tests and coverage gates
        run: bash ./scripts/dev/run_coverage.sh

      - name: Verify pinned ARMv7 observer artifact
        run: |
          cp deploy/venus/bin/venus-evcharger-forensic-observer /tmp/observer.before
          bash rust/forensic-observer/scripts/build-armv7.sh
          cmp /tmp/observer.before deploy/venus/bin/venus-evcharger-forensic-observer

      - name: Verify pinned ARMv7 DBus adapter artifact
        run: |
          cp deploy/venus/bin/venus-evcharger-dbus-adapter /tmp/dbus-adapter.before
          bash rust/dbus-adapter/scripts/build-armv7.sh
          cmp /tmp/dbus-adapter.before deploy/venus/bin/venus-evcharger-dbus-adapter

      - name: Run optional audits
        run: make audit

      - name: Build and validate developer documentation
        run: make docs-check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
