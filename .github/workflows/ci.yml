name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            python3-coverage \
            python3-mypy \
            python3-requests \
            python3-dbus \
            python3-gi \
            shellcheck

      - name: Install Python dev tools
        run: |
          python3 -m venv .venv-ruff
          .venv-ruff/bin/python -m pip install --upgrade pip
          .venv-ruff/bin/python -m pip install ruff pylint bandit codespell radon

      - name: Run syntax, tests, and typecheck
        run: bash ./scripts/dev/check_all.sh

      - name: Run optional audits
        run: make audit

      - name: Generate coverage XML
        run: |
          python3 -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          python3 -m coverage report --fail-under=100
          python3 -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
