[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv-ruff",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mutmut]
source_paths = ["venus_evcharger"]
only_mutate = ["venus_evcharger/bootstrap/wizard_inventory_cli_guided_profile.py"]
also_copy = [
    "venus_evcharger_auto_input_helper.py",
    "venus_evcharger_dbus_adapter.py",
    "venus_evcharger_service.py",
    "CONTROL_API.md",
    "deploy/venus",
]
pytest_add_cli_args = ["-k", "not socket"]
pytest_add_cli_args_test_selection = [
    "tests/test_bootstrap_wizard_inventory_cli_guided_profile_contracts.py",
]
