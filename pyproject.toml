[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv-ruff",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mutmut]
pytest_add_cli_args_test_selection = [
    "tests/test_service_control_runtime_contracts.py",
    "tests/test_service_control_state_contracts.py",
]
